name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          TORUS_BASE_PATH: /torus-field-studio/
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/studio/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Public Pages and forensic bundle smoke
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e .
      - name: Fetch deployed studio and forensic TBX
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 https://genghisdarb.github.io/torus-field-studio/ > /tmp/index.html
          grep -q "TORUS Field Studio" /tmp/index.html
          curl --fail --silent --show-error --retry 8 --retry-delay 5 https://genghisdarb.github.io/torus-field-studio/examples/v021-forensic-combined.tbx.zip --output /tmp/forensic.tbx.zip
          torusbrot audit /tmp/forensic.tbx.zip
