name: Feature request
description: Propose a scoped improvement without expanding scientific authority by implication.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete workflow or user need is not served today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: claim-impact
    attributes:
      label: Claim-boundary impact
      options: [None, Changes a declared claim, Adds an evidence type, Unknown]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
